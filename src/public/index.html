<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>允禾需求訊號雷達</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>允禾需求訊號雷達</h1>
        <p>桃園新公司、PTT OA 商機、標案、租約成熟度與公開搜尋補充來源。</p>
      </div>
      <div class="top-actions">
        <button id="scanNow">重新掃描</button>
        <button id="scanCompanyNow">掃描桃園新公司</button>
        <button id="scanTendersNow">掃描標案</button>
      </div>
    </header>

    <main>
      <section class="stats" id="todayStats"></section>

      <section>
        <h2>桃園新公司雷達</h2>
        <div class="toolbar">
          <select id="companyDaysFilter">
            <option value="">全部</option>
            <option value="90">最近 90 天</option>
            <option value="7">最近 7 天</option>
            <option value="30">最近 30 天</option>
            <option value="60">最近 60 天</option>
            <option value="180">最近 180 天</option>
          </select>
          <input id="companyDistrictFilter" placeholder="行政區，例如中壢區" />
          <input id="companyIndustryFilter" placeholder="行業，例如診所、補習班" />
          <select id="companyGradeFilter">
            <option value="">全部分級</option>
            <option value="S">S 級</option>
            <option value="A">A 級</option>
            <option value="B">B 級</option>
          </select>
          <select id="companyStatusFilter">
            <option value="">全部狀態</option>
            <option value="new">new</option>
            <option value="reviewed">reviewed</option>
            <option value="contacted">contacted</option>
            <option value="ignored">ignored</option>
            <option value="converted">converted</option>
          </select>
        </div>
        <div id="companyList" class="lead-list"></div>
      </section>

      <section>
        <h2>訊號中心</h2>
        <div class="toolbar">
          <select id="signalTypeFilter">
            <option value="">全部訊號</option>
            <option value="contract_maturity">租約成熟度雷達</option>
            <option value="contract">租約到期</option>
            <option value="competitor">競品抱怨</option>
            <option value="move">搬遷/擴編</option>
            <option value="hiring">徵才</option>
            <option value="tender">標案</option>
            <option value="company">新公司</option>
          </select>
          <select id="signalGradeFilter">
            <option value="">全部分級</option>
            <option value="S">S 級</option>
            <option value="A">A 級</option>
            <option value="B">B 級</option>
          </select>
          <input id="signalKeywordFilter" placeholder="關鍵字" />
        </div>
        <div id="signalList" class="lead-list"></div>
      </section>

      <section>
        <h2>PTT / 公開搜尋商機</h2>
        <div class="toolbar">
          <select id="leadSourceFilter">
            <option value="">全部來源</option>
            <option value="ptt">PTT</option>
            <option value="threads">Threads</option>
            <option value="dcard">Dcard</option>
            <option value="mobile01">Mobile01</option>
            <option value="facebook">Facebook 公開頁</option>
          </select>
          <select id="leadGradeFilter">
            <option value="">全部分級</option>
            <option value="S">S 級</option>
            <option value="A">A 級</option>
            <option value="B">B 級</option>
          </select>
          <input id="leadKeywordFilter" placeholder="關鍵字" />
        </div>
        <div id="leadList" class="lead-list"></div>
      </section>

      <section>
        <h2>標案雷達</h2>
        <div class="toolbar">
          <select id="tenderGradeFilter">
            <option value="">全部分級</option>
            <option value="S">S 級</option>
            <option value="A">A 級</option>
            <option value="B">B 級</option>
          </select>
          <input id="tenderKeywordFilter" placeholder="標案關鍵字" />
          <input id="tenderAgencyFilter" placeholder="機關名稱" />
        </div>
        <div id="tenderList" class="lead-list"></div>
      </section>

      <section class="grid">
        <div>
          <h2>Adapter 狀態</h2>
          <div id="adapterStatus" class="status-list"></div>
        </div>
        <div>
          <h2>Scan Log</h2>
          <div id="scanLogs" class="log-list"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
